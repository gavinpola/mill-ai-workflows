<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mill Strategic Roadmap</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --mill-green: #16a34a;
      --mill-green-dark: #15803d;
      --mill-green-light: #22c55e;
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border-color: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #fafafa 0%, #f1f5f9 100%);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--mill-green) 0%, var(--mill-green-dark) 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(22, 163, 74, 0.3);
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .header-links {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .header-links a {
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .header-links a:hover {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.5);
    }

    /* Content */
    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-color);
      border-top-color: var(--mill-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Markdown Styling */
    .markdown-body {
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .markdown-body h1 {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--mill-green);
      letter-spacing: -0.02em;
    }

    .markdown-body h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 48px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border-color);
      letter-spacing: -0.01em;
    }

    .markdown-body h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 32px;
      margin-bottom: 12px;
    }

    .markdown-body h4 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 24px;
      margin-bottom: 8px;
    }

    .markdown-body p {
      margin-bottom: 16px;
      color: var(--text-secondary);
    }

    .markdown-body strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .markdown-body em {
      color: var(--mill-green-dark);
      font-style: italic;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 16px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 8px;
      color: var(--text-secondary);
    }

    .markdown-body a {
      color: var(--mill-green);
      text-decoration: none;
      font-weight: 500;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body hr {
      border: none;
      height: 2px;
      background: var(--border-color);
      margin: 40px 0;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--mill-green);
      padding-left: 20px;
      margin: 20px 0;
      color: var(--text-secondary);
      font-style: italic;
    }

    .markdown-body code {
      background: var(--bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 13px;
      color: var(--mill-green-dark);
    }

    .markdown-body pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 20px;
      border-radius: 12px;
      overflow-x: auto;
      margin: 20px 0;
    }

    .markdown-body pre code {
      background: none;
      color: inherit;
      padding: 0;
    }

    /* Tables */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 14px;
    }

    .markdown-body th {
      background: var(--bg-secondary);
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      color: var(--text-primary);
      border-bottom: 2px solid var(--border-color);
    }

    .markdown-body td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    .markdown-body tr:hover td {
      background: var(--bg-secondary);
    }

    /* Status badges in tables */
    .markdown-body td:nth-child(2) {
      font-weight: 500;
    }

    /* Priority colors */
    .markdown-body td:contains("P0") { color: #ef4444; }
    .markdown-body td:contains("P1") { color: #f59e0b; }
    .markdown-body td:contains("P2") { color: #3b82f6; }

    /* Footer */
    .footer {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .footer a {
      color: var(--mill-green);
      text-decoration: none;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .header h1 {
        font-size: 22px;
      }

      .markdown-body {
        padding: 24px;
      }

      .markdown-body h1 {
        font-size: 24px;
      }

      .markdown-body h2 {
        font-size: 20px;
      }

      .markdown-body table {
        font-size: 12px;
      }

      .markdown-body th, .markdown-body td {
        padding: 8px 10px;
      }
    }

    /* Print styles */
    @media print {
      .header {
        position: relative;
        box-shadow: none;
      }

      .markdown-body {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Mill Strategic Roadmap</h1>
    <p>From Hardware to $10B Data Intelligence Platform</p>
    <div class="header-links">
      <a href="mission-control.html">Mission Control</a>
      <a href="https://github.com/gavinpola/mill-ai-workflows/blob/main/outputs/strategy/gavin_action_plan.md" target="_blank">View Source</a>
    </div>
  </div>

  <div class="content">
    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <p>Loading roadmap...</p>
    </div>
    <div id="markdown-content" class="markdown-body" style="display: none;"></div>
  </div>

  <div class="footer">
    <p>Last updated: <span id="last-updated">Loading...</span></p>
    <p style="margin-top: 8px;">
      <a href="mission-control.html">Back to Mission Control</a>
    </p>
  </div>

  <script>
    // Fetch and render the markdown file
    async function loadMarkdown() {
      try {
        // Fetch from raw GitHub content
        const response = await fetch('https://raw.githubusercontent.com/gavinpola/mill-ai-workflows/main/outputs/strategy/gavin_action_plan.md');

        if (!response.ok) {
          throw new Error('Failed to fetch markdown');
        }

        const markdown = await response.text();

        // Configure marked for GitHub-flavored markdown
        marked.setOptions({
          breaks: true,
          gfm: true
        });

        // Render markdown to HTML
        const html = marked.parse(markdown);

        // Display content
        document.getElementById('loading').style.display = 'none';
        document.getElementById('markdown-content').innerHTML = html;
        document.getElementById('markdown-content').style.display = 'block';

        // Update timestamp
        document.getElementById('last-updated').textContent = new Date().toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });

        // Add status colors to table cells
        colorizeStatus();

      } catch (error) {
        console.error('Error loading markdown:', error);
        document.getElementById('loading').innerHTML = `
          <p style="color: #ef4444;">Failed to load roadmap.</p>
          <p style="margin-top: 8px;">
            <a href="https://github.com/gavinpola/mill-ai-workflows/blob/main/outputs/strategy/gavin_action_plan.md" target="_blank">
              View on GitHub instead
            </a>
          </p>
        `;
      }
    }

    // Colorize status and priority cells
    function colorizeStatus() {
      const cells = document.querySelectorAll('.markdown-body td');
      cells.forEach(cell => {
        const text = cell.textContent.trim().toLowerCase();

        // Status colors
        if (text === 'completed') {
          cell.style.color = '#16a34a';
          cell.style.fontWeight = '600';
        } else if (text === 'pending') {
          cell.style.color = '#94a3b8';
        } else if (text === 'in_progress' || text === 'in progress') {
          cell.style.color = '#2563eb';
          cell.style.fontWeight = '600';
        }

        // Priority colors
        if (text === 'p0') {
          cell.style.color = '#ef4444';
          cell.style.fontWeight = '600';
        } else if (text === 'p1') {
          cell.style.color = '#f59e0b';
          cell.style.fontWeight = '600';
        } else if (text === 'p2') {
          cell.style.color = '#3b82f6';
        } else if (text === 'p3') {
          cell.style.color = '#94a3b8';
        }

        // Impact colors
        if (text === 'high') {
          cell.style.color = '#16a34a';
          cell.style.fontWeight = '500';
        } else if (text === 'low') {
          cell.style.color = '#94a3b8';
        }
      });
    }

    // Load on page ready
    loadMarkdown();
  </script>
</body>
</html>
