<!DOCTYPE html>
<html class="staticrypt-html">
<head>
    <meta charset="utf-8" />
    <title>/*[|template_title|]*/0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff;
            --off-white: #fafafa;
            --light-gray: #f5f5f5;
            --border: #e5e5e5;
            --text: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .staticrypt-html { height: 100%; }
        .staticrypt-body {
            height: 100%;
            margin: 0;
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            background: var(--white);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .staticrypt-page {
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }
        .staticrypt-form {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 48px 40px;
            text-align: center;
        }
        .staticrypt-logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .staticrypt-title {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-bottom: 32px;
        }
        .staticrypt-instructions {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .staticrypt-password-container {
            position: relative;
            background: var(--light-gray);
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .staticrypt-form input[type="password"],
        .staticrypt-form input[type="text"] {
            font-family: 'Space Grotesk', sans-serif;
            width: 100%;
            padding: 14px 44px 14px 16px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--light-gray);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        .staticrypt-form input[type="password"]:focus,
        .staticrypt-form input[type="text"]:focus {
            border-color: var(--text);
        }
        .staticrypt-toggle-password-visibility {
            cursor: pointer;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .staticrypt-toggle-password-visibility:hover {
            opacity: 0.8;
        }
        .staticrypt-decrypt-button {
            font-family: 'Space Grotesk', sans-serif;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--white);
            background: var(--text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .staticrypt-decrypt-button:hover {
            background: #333;
        }
        label.staticrypt-remember {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .staticrypt-remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .hidden { display: none !important; }
        .staticrypt-spinner-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .staticrypt-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .staticrypt-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body class="staticrypt-body">
    <div id="staticrypt_loading" class="staticrypt-spinner-container">
        <div class="staticrypt-spinner"></div>
    </div>

    <div id="staticrypt_content" class="staticrypt-page hidden">
        <div class="staticrypt-form">
            <div class="staticrypt-logo">mill</div>
            <p class="staticrypt-title">/*[|template_title|]*/0</p>
            <p class="staticrypt-instructions">/*[|template_instructions|]*/0</p>

            <form id="staticrypt-form" action="#" method="post">
                <div class="staticrypt-password-container">
                    <input
                        id="staticrypt-password"
                        type="password"
                        name="password"
                        placeholder="/*[|template_placeholder|]*/0"
                        autofocus
                    />
                    <img
                        class="staticrypt-toggle-password-visibility"
                        alt="/*[|template_toggle_show|]*/0"
                        title="/*[|template_toggle_show|]*/0"
                        src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NDAgNTEyIj48cGF0aCBkPSJNMzguOCA1LjFDMjguNC0zLjEgMTMuMy0xLjIgNS4xIDkuMlMtMS4yIDM0LjcgOS4yIDQyLjlsNTkyIDQ2NGMxMC40IDguMiAyNS41IDYuMyAzMy43LTQuMXM2LjMtMjUuNS00LjEtMzMuN0w1MjUuNiAzODYuN2MzOS42LTQwLjYgNjYuNC04Ni4xIDc5LjktMTE4LjRjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDY1LjUgNjguOCA0MDAuOCAzMiAzMjAgMzJjLTY4LjIgMC0xMjUgMjYuMy0xNjkuMyA2MC44TDM4LjggNS4xek0yMjMuMSAxNDkuNUMyNDguNiAxMjYuMiAyODIuNyAxMTIgMzIwIDExMmM3OS41IDAgMTQ0IDY0LjUgMTQ0IDE0NGMwIDI0LjktNi4zIDQ4LjMtMTcuNCA2OC43TDQwOCAyOTQuNWM4LjQtMTkuMyAxMC42LTQxLjQgNC44LTYzLjNjLTExLjEtNDEuNS00Ny44LTY5LjQtODguNi03MS4xYy01LjgtLjItOS4yIDYuMS03LjQgMTEuN2MyLjEgNi40IDMuMyAxMy4yIDMuMyAyMC4zYzAgMTAuMi0yLjQgMTkuOC02LjYgMjguM2wtOTAuMy03MC44ek0zNzMgMzg5LjljLTE2LjQgNi41LTM0LjMgMTAuMS01MyAxMC4xYy03OS41IDAtMTQ0LTY0LjUtMTQ0LTE0NGMwLTYuOSAuNS0xMy42IDEuNC0yMC4yTDgzLjEgMTYxLjVDNjAuMyAxOTEuMiA0NCAyMjAuOCAzNC41IDI0My43Yy0zLjMgNy45LTMuMyAxNi43IDAgMjQuNmMxNC45IDM1LjcgNDYuMiA4Ny43IDkzIDEzMS4xQzE3NC41IDQ0My4yIDIzOS4yIDQ4MCAzMjAgNDgwYzQ3LjggMCA4OS45LTEyLjkgMTI2LjItMzIuNUwzNzMgMzg5Ljl6Ii8+PC9zdmc+"
                    />
                </div>

                <label id="staticrypt-remember-label" class="staticrypt-remember hidden">
                    <input id="staticrypt-remember" type="checkbox" name="remember" />
                    /*[|template_remember|]*/0
                </label>

                <input type="submit" class="staticrypt-decrypt-button" value="/*[|template_button|]*/0" />
            </form>
        </div>
        <div class="staticrypt-footer">mill AI workflow system</div>
    </div>

    <script>
        const staticryptInitiator = /*[|js_staticrypt|]*/0;
        const config = /*[|staticrypt_config|]*/0;
        const templateError = "/*[|template_error|]*/0";
        const templateToggleAltShow = "/*[|template_toggle_show|]*/0";
        const templateToggleAltHide = "/*[|template_toggle_hide|]*/0";
        const isRememberEnabled = /*[|is_remember_enabled|]*/0;
        const staticryptSaltUniqueVariableName = "/*[|variable_name|]*/0";

        const codec = staticryptInitiator.init(config);

        function handleError() {
            document.getElementById("staticrypt-password").value = "";
            document.getElementById("staticrypt-password").placeholder = templateError;
            document.getElementById("staticrypt-password").classList.add("error");
        }

        async function handleDecrypt(evt) {
            evt.preventDefault();
            const password = document.getElementById("staticrypt-password").value;
            const isRememberChecked = document.getElementById("staticrypt-remember").checked;
            const result = await codec.handleDecryptionOfPage(password, isRememberChecked);
            if (!result.isSuccessful) {
                handleError();
            }
        }

        document.getElementById("staticrypt-form").addEventListener("submit", handleDecrypt);

        // Toggle password visibility
        const toggleIcon = document.querySelector(".staticrypt-toggle-password-visibility");
        if (toggleIcon) {
            toggleIcon.addEventListener("click", () => {
                const input = document.getElementById("staticrypt-password");
                if (input.type === "password") {
                    input.type = "text";
                    toggleIcon.alt = templateToggleAltHide;
                    toggleIcon.title = templateToggleAltHide;
                } else {
                    input.type = "password";
                    toggleIcon.alt = templateToggleAltShow;
                    toggleIcon.title = templateToggleAltShow;
                }
            });
        }

        // Show remember checkbox if enabled
        if (isRememberEnabled) {
            document.getElementById("staticrypt-remember-label").classList.remove("hidden");
        }

        // Auto-decrypt from stored password
        (async () => {
            const result = await codec.handleDecryptOnLoad();
            if (!result.isSuccessful) {
                document.getElementById("staticrypt_loading").classList.add("hidden");
                document.getElementById("staticrypt_content").classList.remove("hidden");
                document.getElementById("staticrypt-password").focus();
            }
        })();
    </script>
</body>
</html>
