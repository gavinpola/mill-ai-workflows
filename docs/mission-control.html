<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mill Mission Control</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    /* Scratchboard planet styles */
    .scratchboard-glow {
      animation: scratchboard-pulse 3s ease-in-out infinite;
    }
    @keyframes scratchboard-pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.7; }
    }
    .scratchboard-label {
      font-size: 11px;
      fill: var(--text-secondary);
      text-anchor: middle;
    }
  </style>
</head>
<body>

  <!-- Breadcrumb Navigation -->
  <div id="breadcrumb">
    <span class="breadcrumb-item active" data-level="0">Mission Control</span>
  </div>

  <!-- Stats Panel -->
  <div id="stats">
    <div class="stat">
      <span class="stat-value" id="stat-total">220</span>
      <span class="stat-label">Tasks</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-completed">7</span>
      <span class="stat-label">Done</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-progress">3%</span>
      <span class="stat-label">Progress</span>
    </div>
  </div>

  <!-- Search -->
  <div id="search">
    <input type="text" placeholder="Search tasks..." id="search-input">
  </div>

  <!-- Filters -->
  <div id="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="P0">P0</button>
    <button class="filter-btn" data-filter="P1">P1</button>
    <button class="filter-btn" data-filter="completed">Done</button>
    <button class="filter-btn" data-filter="pending">Todo</button>
  </div>

  <!-- Main Canvas -->
  <svg id="canvas">
    <defs>
      <radialGradient id="gradient-thesis" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#16a34a" stop-opacity="0.4"/>
      </radialGradient>
      <radialGradient id="gradient-glow">
        <stop offset="0%" stop-color="#22c55e" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g id="zoom-container">
      <g id="connections"></g>
      <g id="nodes"></g>
    </g>
  </svg>

  <!-- Detail Panel -->
  <div id="detail-panel">
    <h3 id="detail-title">Task Title</h3>
    <p class="tagline" id="detail-tagline">Task description</p>
    <div class="meta" id="detail-meta"></div>
    <div class="detail-actions" id="detail-actions">
      <button class="btn btn-primary" id="btn-toggle-status">Mark Complete</button>
      <button class="btn btn-secondary" id="btn-close-detail">Close</button>
    </div>
  </div>

  <!-- Legend -->
  <div id="legend">
    <h4>Visual Guide</h4>
    <div class="legend-section">
      <div class="legend-items">
        <div class="legend-item">
          <div class="legend-color" style="background: var(--color-commercial);"></div>
          <span>Commercial</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: var(--color-ai);"></div>
          <span>AI</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: var(--color-data);"></div>
          <span>Data</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: var(--color-outcomes);"></div>
          <span>Outcomes</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: var(--color-scale);"></div>
          <span>Scale</span>
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background: #f59e0b;"></div>
          <span>Gavin</span>
        </div>
      </div>
    </div>
    <div class="legend-section">
      <div class="legend-items">
        <div class="legend-item">
          <div class="legend-ring" style="border: 3px solid var(--status-completed);"></div>
          <span>Done</span>
        </div>
        <div class="legend-item">
          <div class="legend-ring" style="border: 3px solid var(--status-in-progress);"></div>
          <span>Active</span>
        </div>
        <div class="legend-item">
          <div class="legend-ring" style="border: 3px solid var(--status-pending);"></div>
          <span>Pending</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <button class="control-btn" id="btn-zoom-in" title="Zoom In">+</button>
    <button class="control-btn" id="btn-zoom-out" title="Zoom Out">-</button>
    <button class="control-btn" id="btn-reset" title="Reset View">&#8962;</button>
  </div>

  <!-- Tooltip -->
  <div class="tooltip" id="tooltip" style="display: none;">
    <div class="tooltip-title"></div>
    <div class="tooltip-meta"></div>
  </div>

    const COLORS = {
      commercial: '#2563eb',
      ai: '#7c3aed',
      data: '#ea580c',
      outcomes: '#16a34a',
      scale: '#0d9488',
      thesis: '#22c55e'
    };

    const PRIORITY_COLORS = {
      P0: '#ef4444',
      P1: '#f59e0b',
      P2: '#3b82f6',
      P3: '#71717a'
    };

    const STATUS_COLORS = {
      completed: '#16a34a',
      in_progress: '#2563eb',
      pending: '#71717a'
    };

    let data = DATA;
    let currentNode = null;
    let currentZoomLevel = 1;
    let currentFilter = 'all';
    let svg, container, zoom;
    let width, height;

    function init() {
      loadState();
      svg = d3.select('#canvas');
      container = d3.select('#zoom-container');
      updateDimensions();
      window.addEventListener('resize', () => {
        updateDimensions();
        render(currentNode || data);
      });
      zoom = d3.zoom()
        .scaleExtent([0.5, 5])
        .on('zoom', (event) => {
          container.attr('transform', event.transform);
        });
      svg.call(zoom);
      render(data);
      updateStats();
      setupEventListeners();
    }

    function updateDimensions() {
      width = window.innerWidth;
      height = window.innerHeight;
      svg.attr('width', width).attr('height', height);
    }

    function loadState() {
      const saved = localStorage.getItem('mill-mission-control');
      if (saved) {
        const state = JSON.parse(saved);
        applyState(data, state);
        applyState(SCRATCHBOARD, state);
      }
    }

    function applyState(node, state) {
      if (state[node.id]) {
        node.status = state[node.id].status || node.status;
      }
      if (node.children) {
        node.children.forEach(child => {
          if (child.children) {
            child.children.forEach(subchild => {
              if (subchild.children) {
                subchild.children.forEach(task => applyState(task, state));
              }
              applyState(subchild, state);
            });
          }
          applyState(child, state);
        });
      }
    }

    function saveState() {
      const state = {};
      collectState(data, state);
      collectState(SCRATCHBOARD, state);
      localStorage.setItem('mill-mission-control', JSON.stringify(state));
    }

    function collectState(node, state) {
      if (node.type === 'task' && node.status) {
        state[node.id] = { status: node.status };
      }
      if (node.children) {
        node.children.forEach(child => {
          if (child.children) {
            child.children.forEach(subchild => {
              if (subchild.children) {
                subchild.children.forEach(task => collectState(task, state));
              }
              collectState(subchild, state);
            });
          }
          collectState(child, state);
        });
      }
    }

    function render(rootNode) {
      currentNode = rootNode;
      const nodesGroup = d3.select('#nodes');
      const connectionsGroup = d3.select('#connections');
      nodesGroup.selectAll('*').remove();
      connectionsGroup.selectAll('*').remove();
      const centerX = width / 2;
      const centerY = height / 2;
      if (rootNode.type === 'thesis') {
        renderGalaxyView(rootNode, centerX, centerY, nodesGroup, connectionsGroup);
        currentZoomLevel = 1;
      } else if (rootNode.type === 'pillar') {
        renderPillarView(rootNode, centerX, centerY, nodesGroup, connectionsGroup);
        currentZoomLevel = 2;
      } else if (rootNode.type === 'subgoal') {
        renderSubgoalView(rootNode, centerX, centerY, nodesGroup, connectionsGroup);
        currentZoomLevel = 3;
      }
      updateBreadcrumb(rootNode);
      resetZoom();
    }

    function renderGalaxyView(root, cx, cy, nodesGroup, connectionsGroup) {
      const orbitRadius = Math.min(width, height) * 0.3;
      const pillarRadius = 60;
      const centerRadius = 80;
      const centerGroup = nodesGroup.append('g')
        .attr('class', 'node')
        .attr('transform', `translate(${cx}, ${cy})`);
      centerGroup.append('circle')
        .attr('r', centerRadius + 20)
        .attr('fill', 'url(#gradient-glow)')
        .attr('class', 'glow');

    function calculateProgress(node) {
      if (node.type === 'task') {
        return node.status === 'completed' ? 1 : 0;
      }
      if (!node.children || node.children.length === 0) return 0;
      let total = 0;
      let completed = 0;
      function countAll(n) {
        if (n.type === 'task') {
          total++;
          if (n.status === 'completed') completed++;
        }
        if (n.children) {
          n.children.forEach(countAll);
        }
      }
      node.children.forEach(countAll);
      return total > 0 ? completed / total : 0;
    }

    function countTasks(node) {
      let count = 0;
      function countAll(n) {
        if (n.type === 'task') count++;
        if (n.children) n.children.forEach(countAll);
      }
      if (node.children) node.children.forEach(countAll);
      return count;
    }

    function countCompleted(node) {
      let count = 0;
      function countAll(n) {
        if (n.type === 'task' && n.status === 'completed') count++;
        if (n.children) n.children.forEach(countAll);
      }
      if (node.children) node.children.forEach(countAll);
      return count;
    }

    function filterTask(task) {
      if (currentFilter === 'all') return true;
      if (currentFilter === 'completed') return task.status === 'completed';
      if (currentFilter === 'pending') return task.status !== 'completed';
      if (currentFilter === 'P0' || currentFilter === 'P1') return task.priority === currentFilter;
      return true;
    }

    function updateStats() {
      const total = countTasks(data);
      const completed = countCompleted(data);
      const progress = total > 0 ? Math.round((completed / total) * 100) : 0;
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-completed').textContent = completed;
      document.getElementById('stat-progress').textContent = `${progress}%`;
    }

    function updateBreadcrumb(node) {
      const breadcrumb = document.getElementById('breadcrumb');
      breadcrumb.innerHTML = '';
      const path = [];
      if (node.type === 'thesis') {
        path.push({ name: 'Mission Control', node: data });
      } else if (node.type === 'scratchboard') {
        path.push({ name: 'Mission Control', node: data });
        path.push({ name: "Gavin's Tasks", node: SCRATCHBOARD, action: () => renderScratchboard(SCRATCHBOARD) });
      } else if (node.type === 'scratchboard-subgoal') {
        path.push({ name: 'Mission Control', node: data });
        path.push({ name: "Gavin's Tasks", node: SCRATCHBOARD, action: () => renderScratchboard(SCRATCHBOARD) });
        path.push({ name: node.name.substring(0, 15), node: node });
      } else if (node.type === 'pillar') {
        path.push({ name: 'Mission Control', node: data });
        path.push({ name: node.name.split(' ')[0], node: node });
      } else if (node.type === 'subgoal') {
        path.push({ name: 'Mission Control', node: data });
        if (data.children) {
          for (const pillar of data.children) {
            if (pillar.children) {
              for (const sg of pillar.children) {
                if (sg.id === node.id) {
                  path.push({ name: pillar.name.split(' ')[0], node: pillar });
                  break;
                }
              }
            }
          }
        }
        path.push({ name: node.name.substring(0, 20), node: node });
      }
      path.forEach((item, i) => {
        const span = document.createElement('span');
        span.className = 'breadcrumb-item' + (i === path.length - 1 ? ' active' : '');
        span.textContent = item.name;
        span.onclick = () => {
          if (item.action) {
            item.action();
          } else {
            render(item.node);
          }
        };
        breadcrumb.appendChild(span);
        if (i < path.length - 1) {
          const sep = document.createElement('span');
          sep.className = 'breadcrumb-separator';
          sep.textContent = '\u203A';
          breadcrumb.appendChild(sep);
        }
      });
    }

    function resetZoom() {
      svg.transition().duration(500).call(
        zoom.transform,
        d3.zoomIdentity
      );
    }

    function showTooltip(event, node) {
      const tooltip = document.getElementById('tooltip');
      const title = tooltip.querySelector('.tooltip-title');
      const meta = tooltip.querySelector('.tooltip-meta');
      title.textContent = node.name;
      let metaText = '';
      if (node.type === 'task') {
        metaText = `${node.priority || 'No priority'} \u2022 ${node.status || 'pending'} \u2022 ${node.effort || 'medium'} effort`;
      } else if (node.type === 'pillar' || node.type === 'subgoal') {
        const tasks = countTasks(node);
        const completed = countCompleted(node);
        metaText = `${completed}/${tasks} tasks complete`;
      }
      meta.textContent = metaText;
      tooltip.style.display = 'block';
      tooltip.style.left = event.pageX + 15 + 'px';
      tooltip.style.top = event.pageY + 15 + 'px';
    }

    function hideTooltip() {
      document.getElementById('tooltip').style.display = 'none';
    }

    let selectedTask = null;
    let selectedSubgoal = null;
    let selectedIsScratchboard = false;

    function showDetail(task, subgoal, isScratchboard = false) {
      selectedTask = task;
      selectedSubgoal = subgoal;
      selectedIsScratchboard = isScratchboard;
      const panel = document.getElementById('detail-panel');
      document.getElementById('detail-title').textContent = task.name;
      document.getElementById('detail-tagline').textContent = task.isWin ? '\u2B50 Key Win' : '';
      const meta = document.getElementById('detail-meta');
      meta.innerHTML = `
        <div class="meta-item">
          <span class="meta-badge priority-${task.priority}">${task.priority || 'No priority'}</span>
        </div>
        <div class="meta-item">
          <span class="meta-badge status-${task.status}">${task.status || 'pending'}</span>
        </div>
        <div class="meta-item">
          <span class="meta-badge effort-${task.effort}">${task.effort || 'medium'} effort</span>
        </div>
        <div class="meta-item">
          <span class="meta-badge">${task.impact || 'medium'} impact</span>
        </div>
      `;
      const btn = document.getElementById('btn-toggle-status');
      btn.textContent = task.status === 'completed' ? 'Mark Incomplete' : 'Mark Complete';
      btn.className = task.status === 'completed' ? 'btn btn-secondary' : 'btn btn-primary';
      panel.classList.add('visible');
    }

    function hideDetail() {
      document.getElementById('detail-panel').classList.remove('visible');
      selectedTask = null;
      selectedSubgoal = null;
    }

    function toggleTaskStatus() {
      if (!selectedTask) return;
      selectedTask.status = selectedTask.status === 'completed' ? 'pending' : 'completed';
      saveState();
      updateStats();
      if (selectedIsScratchboard) {
        renderScratchboardSubgoal(selectedSubgoal);
      } else {
        render(currentNode);
      }
      showDetail(selectedTask, selectedSubgoal, selectedIsScratchboard);
    }

    function setupEventListeners() {
      document.getElementById('btn-close-detail').onclick = hideDetail;
      document.getElementById('btn-toggle-status').onclick = toggleTaskStatus;
      document.getElementById('btn-zoom-in').onclick = () => {
        svg.transition().duration(300).call(zoom.scaleBy, 1.3);
      };
      document.getElementById('btn-zoom-out').onclick = () => {
        svg.transition().duration(300).call(zoom.scaleBy, 0.7);
      };
      document.getElementById('btn-reset').onclick = () => {
        render(data);
      };
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = btn.dataset.filter;
          render(currentNode);
        };
      });
      const searchInput = document.getElementById('search-input');
      searchInput.oninput = debounce((e) => {
        const query = e.target.value.toLowerCase();
        if (!query) {
          render(currentNode);
          return;
        }
        const results = [];
        function searchNode(node, path = []) {
          if (node.type === 'task' && node.name.toLowerCase().includes(query)) {
            results.push({ task: node, path: [...path] });
          }
          if (node.children) {
            node.children.forEach(child => searchNode(child, [...path, node]));
          }
        }
        searchNode(data);
        if (results.length > 0) {
          const result = results[0];
          const subgoal = result.path.find(n => n.type === 'subgoal');
          if (subgoal) {
            render(subgoal);
          }
        }
      }, 300);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (document.getElementById('detail-panel').classList.contains('visible')) {
            hideDetail();
          } else if (currentZoomLevel > 1) {
            if (currentNode.type === 'subgoal') {
              if (data.children) {
                for (const pillar of data.children) {
                  if (pillar.children) {
                    for (const sg of pillar.children) {
                      if (sg.id === currentNode.id) {
                        render(pillar);
                        return;
                      }
                    }
                  }
                }
              }
            } else if (currentNode.type === 'pillar') {
              render(data);
            }
          }
        }
      });
    }

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    init();
  </script>
</body>
</html>
