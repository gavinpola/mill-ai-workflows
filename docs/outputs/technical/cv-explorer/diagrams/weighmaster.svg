<svg viewBox="0 0 400 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .component { cursor: pointer; }
    .component:hover .highlight { opacity: 0.2; }
    .label { font-family: 'Space Grotesk', sans-serif; font-size: 11px; fill: #666; }
    .part { fill: #1a1a1a; }
    .part-light { fill: #4a4a4a; }
    .bin { fill: #e5e5e5; stroke: #ccc; stroke-width: 1; }
    .load-cell { fill: #1a1a1a; }
    .load-cell-top { fill: #666; }
    .signal-line { fill: none; stroke: #3498db; stroke-width: 2; }
    .graph-bg { fill: #fafafa; stroke: #e5e5e5; stroke-width: 1; }
    .graph-line { fill: none; stroke: #1a1a1a; stroke-width: 2; }
    .graph-axis { stroke: #ccc; stroke-width: 1; }
    .hotspot { fill: #3498db; opacity: 0; }
    .highlight { fill: #3498db; opacity: 0; transition: opacity 0.2s; }
  </style>

  <!-- Camera on top -->
  <g class="component" data-part="camera">
    <rect class="highlight" x="160" y="20" width="80" height="50" rx="4"/>
    <rect class="part" x="170" y="30" width="60" height="35" rx="4"/>
    <circle class="part-light" cx="200" cy="47" r="10"/>
    <circle fill="#333" cx="200" cy="47" r="6"/>
    <rect class="part" x="185" y="65" width="30" height="8"/>
    <text class="label" x="200" y="22" text-anchor="middle">RGB camera</text>
  </g>

  <!-- Bin body -->
  <g class="component" data-part="bin">
    <rect class="highlight" x="95" y="80" width="210" height="140" rx="8"/>
    <rect class="bin" x="100" y="90" width="200" height="120" rx="8"/>
    <rect class="bin" x="90" y="80" width="220" height="20" rx="4"/>
    <text class="label" x="200" y="160" text-anchor="middle">Bin (on load cells)</text>
  </g>

  <!-- Food items in bin -->
  <g opacity="0.6">
    <circle cx="140" cy="140" r="12" fill="#8bc34a"/>
    <circle cx="180" cy="150" r="10" fill="#ff9800"/>
    <circle cx="220" cy="135" r="14" fill="#e91e63"/>
    <circle cx="260" cy="145" r="8" fill="#4caf50"/>
  </g>

  <!-- Load cells -->
  <g class="component" data-part="loadcells">
    <rect class="highlight" x="85" y="210" width="230" height="35" rx="4"/>
    <!-- Left load cell -->
    <rect class="load-cell" x="110" y="215" width="40" height="25" rx="2"/>
    <rect class="load-cell-top" x="115" y="210" width="30" height="8" rx="1"/>
    <!-- Center load cell -->
    <rect class="load-cell" x="180" y="215" width="40" height="25" rx="2"/>
    <rect class="load-cell-top" x="185" y="210" width="30" height="8" rx="1"/>
    <!-- Right load cell -->
    <rect class="load-cell" x="250" y="215" width="40" height="25" rx="2"/>
    <rect class="load-cell-top" x="255" y="210" width="30" height="8" rx="1"/>
    <text class="label" x="65" y="230" text-anchor="end">Load cells</text>
    <text class="label" x="65" y="242" text-anchor="end" font-size="9">(100+ Hz)</text>
  </g>

  <!-- Base plate -->
  <rect fill="#ddd" x="90" y="245" width="220" height="8" rx="2"/>

  <!-- Weight signature graph -->
  <g class="component" data-part="signature">
    <rect class="highlight" x="85" y="260" width="230" height="95" rx="4"/>
    <rect class="graph-bg" x="95" y="270" width="210" height="75" rx="4"/>

    <!-- Graph axes -->
    <line class="graph-axis" x1="115" y1="330" x2="285" y2="330"/>
    <line class="graph-axis" x1="115" y1="280" x2="115" y2="330"/>

    <!-- Impact curve visualization -->
    <path class="graph-line" d="M 120,325
      L 140,325
      L 145,320
      L 150,290
      L 155,295
      L 160,310
      L 170,315
      L 175,315
      L 180,315
      L 185,310
      L 190,285
      L 195,292
      L 200,305
      L 210,310
      L 220,310
      L 225,305
      L 230,280
      L 235,288
      L 240,300
      L 250,308
      L 280,310"/>

    <!-- Axis labels -->
    <text class="label" x="200" y="343" text-anchor="middle" font-size="9">Time</text>
    <text class="label" x="105" y="305" text-anchor="end" font-size="9" transform="rotate(-90, 105, 305)">Weight</text>

    <text class="label" x="315" y="290" text-anchor="start">Impact</text>
    <text class="label" x="315" y="302" text-anchor="start">signatures</text>
  </g>

  <!-- Signal lines from load cells to graph -->
  <path class="signal-line" d="M 130,240 L 130,250 L 140,265" stroke-dasharray="4,2"/>
  <path class="signal-line" d="M 200,240 L 200,265" stroke-dasharray="4,2"/>
  <path class="signal-line" d="M 270,240 L 270,250 L 260,265" stroke-dasharray="4,2"/>

  <!-- Caption -->
  <text x="200" y="358" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="12" fill="#1a1a1a" font-weight="600">High-frequency weight sampling captures impact curves</text>
</svg>
