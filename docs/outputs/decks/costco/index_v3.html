<!DOCTYPE html>
<html class="staticrypt-html">
<head>
    <meta charset="utf-8" />
    <title>Protected Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --white: #ffffff;
            --off-white: #fafafa;
            --light-gray: #f5f5f5;
            --border: #e5e5e5;
            --text: #1a1a1a;
            --text-secondary: #666666;
            --text-muted: #999999;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .staticrypt-html { height: 100%; }
        .staticrypt-body {
            height: 100%;
            margin: 0;
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            background: var(--white);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .staticrypt-page {
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }
        .staticrypt-form {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 48px 40px;
            text-align: center;
        }
        .staticrypt-logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .staticrypt-title {
            font-size: 1rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-bottom: 32px;
        }
        .staticrypt-instructions {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }
        .staticrypt-password-container {
            position: relative;
            background: var(--light-gray);
            border-radius: 8px;
            margin-bottom: 16px;
        }
        .staticrypt-form input[type="password"],
        .staticrypt-form input[type="text"] {
            font-family: 'Space Grotesk', sans-serif;
            width: 100%;
            padding: 14px 44px 14px 16px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--light-gray);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        .staticrypt-form input[type="password"]:focus,
        .staticrypt-form input[type="text"]:focus {
            border-color: var(--text);
        }
        .staticrypt-toggle-password-visibility {
            cursor: pointer;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .staticrypt-toggle-password-visibility:hover {
            opacity: 0.8;
        }
        .staticrypt-decrypt-button {
            font-family: 'Space Grotesk', sans-serif;
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--white);
            background: var(--text);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .staticrypt-decrypt-button:hover {
            background: #333;
        }
        label.staticrypt-remember {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 0.875rem;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .staticrypt-remember input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .hidden { display: none !important; }
        .staticrypt-spinner-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .staticrypt-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--text);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .staticrypt-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>

            document.getElementById("staticrypt-remember-label").classList.remove("hidden");
        }

        // Auto-decrypt from stored password
        (async () => {
            const result = await codec.handleDecryptOnLoad();
            if (!result.isSuccessful) {
                document.getElementById("staticrypt_loading").classList.add("hidden");
                document.getElementById("staticrypt_content").classList.remove("hidden");
                document.getElementById("staticrypt-password").focus();
            }
        })();
    </script>
</body>
</html>
